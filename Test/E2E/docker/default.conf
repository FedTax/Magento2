# HTTP storefront vhost for Playwright E2E.
#
# Overlays the markoshust/magento-nginx image's default vhost, which is
# HTTPS-only with a self-signed cert (8000 -> redirect -> 8443). E2E doesn't
# want a self-signed cert in the way, so we serve plain HTTP on :8080 instead.
#
# All the real routing (pub/ doc root, static & media handlers, the version
# rewrites, security rules) is Magento's own nginx.conf, copied from
# nginx.conf.sample into the Magento root by scripts/install-magento.sh. That
# sample is an include-body: it expects an `upstream fastcgi_backend`, a
# `$MAGE_ROOT`, and a `listen`, all of which we supply here.

# php-fpm is reached over the unix socket the markoshust php image listens on
# (/sock/phpfpm.sock), shared via the `sockdata` volume in docker-compose.e2e.yml.
upstream fastcgi_backend {
    server unix:/sock/phpfpm.sock;
}

server {
    listen 8080;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    # developer mode surfaces exceptions in the response instead of a generic
    # 500, which makes a failed E2E run far easier to debug from the artifacts.
    set $MAGE_MODE developer;

    # The `[.]` is a glob, not a literal dot: it matches zero files (without
    # erroring) when nginx.conf isn't there yet. nginx is started by
    # `docker compose up` before Magento is installed, so a plain `include` of a
    # missing file would crash it on boot. install-magento.sh copies
    # nginx.conf.sample -> nginx.conf and reloads nginx once the codebase exists.
    include /var/www/html/nginx[.]conf;
}
