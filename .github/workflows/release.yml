# Release workflow — generated by .dev-kit/ci/scaffold.sh
# Source: .dev-kit/ci/templates/release.yml
# Creates a GitHub release when a version tag is pushed and posts
# the headline to Slack #releases (auto-skipped if the org secret
# SLACK_RELEASES_WEBHOOK_URL isn't visible to this repo).
#
# Tag format: v1.2.3

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived installation token from the
      # `fedtax-automation-reader` GitHub App so checkout can fetch the
      # private .dev-kit submodule without a per-repo deploy key.
      # Org-level secrets `FEDTAX_READER_APP_ID` and
      # `FEDTAX_READER_APP_PRIVATE_KEY` are visible to every private
      # repo by org Actions-secrets policy.
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FEDTAX_READER_APP_ID }}
          private-key: ${{ secrets.FEDTAX_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Recursive fetch is a no-op when there are no submodules, so
          # this works for both standalone repos and ones consuming
          # .dev-kit. `token` is used for both the parent and submodule
          # clones, so it must have read access to both — the App
          # installation covers the whole org with `contents: read`.
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: make build

      - name: Create GitHub Release
        # Uses the auto-injected GITHUB_TOKEN (contents:write on the
        # calling repo) — the App token is read-only.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Post release headline to Slack #releases
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          TAG:               ${{ github.ref_name }}
          REPO:              ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_RELEASES_WEBHOOK_URL not visible — skipping Slack post."
            exit 0
          fi
          # Slack auto-unfurls GitHub release URLs into a card with
          # the title and notes preview, so the message stays a
          # one-liner. Don't wrap the URL in <url|label> mrkdwn —
          # that suppresses the unfurl.
          url="https://github.com/${REPO}/releases/tag/${TAG}"
          text="*${REPO} ${TAG} released*"$'\n'"${url}"
          payload=$(jq -n \
            --arg text "$text" \
            '{ text: $text, unfurl_links: true, unfurl_media: true }')
          curl -fsSL -X POST -H 'Content-Type: application/json' \
               --data "$payload" "$SLACK_WEBHOOK_URL"
