# CI workflow — generated by .dev-kit/ci/scaffold.sh
# Source: .dev-kit/ci/templates/ci.yml
# Runs lint, test, and build on every push and pull request.
#
# Relies on standard Make targets from .dev-kit/mk/common.mk.
# Customize behavior by defining _lint, _test, _build in your Makefile.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Recursive fetch is a no-op when there are no submodules, so
          # this works for both standalone repos and ones consuming
          # .dev-kit. The deploy key is configured in ~/.ssh by the
          # action itself (umask 077, GitHub's known_hosts pinned).
          submodules: recursive
          ssh-key: ${{ secrets.DEVKIT_DEPLOY_KEY }}

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
