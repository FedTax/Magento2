# E2E serving layer — overlays docker-compose.yml (it does NOT replace it).
#
# The base stack runs the `app` (php-fpm) container as `sleep infinity`: the
# integration suite execs PHPUnit inside it and never speaks HTTP, so no web
# server is needed there. Playwright drives a real browser, so E2E DOES need
# Magento served over HTTP. This override adds exactly that, and nothing else:
#
#   * `app` runs php-fpm instead of sleeping, so it creates the unix socket
#     (/sock/phpfpm.sock) the markoshust image's php-fpm listens on.
#   * a new `nginx` container fastcgi_passes to that socket and publishes the
#     storefront on the host (MAGENTO_HTTP_PORT, default 8080).
#
# Used only by the E2E path (make e2e-* / the e2e-tests workflow), always with
# BOTH files:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml ...
# Integration runs use docker-compose.yml alone and are completely unaffected
# (no nginx, app still sleeps).

services:
  app:
    # Replace `sleep infinity` with the image's php-fpm. php-fpm.conf ships with
    # daemonize=no, so it stays in the foreground and keeps the container alive
    # exactly as `sleep infinity` did — `docker compose exec` still works.
    command: ["php-fpm"]
    volumes:
      # Shared with nginx so it can reach php-fpm over the unix socket the
      # markoshust php image listens on. (List is merged with the base service's
      # volumes; the Magento + module + composer-cache mounts are preserved.)
      - "sockdata:/sock"

  nginx:
    # Same vendor as the php image (markoshust/magento-php), so the container
    # runs as uid 1000 and can read the app:app 0660 php-fpm socket. We mount our
    # own vhost over the image's default (HTTPS-only) config — see docker/default.conf.
    image: "markoshust/magento-nginx:1.28"
    depends_on:
      app:
        condition: service_started
    volumes:
      - "${MAGENTO_INSTALL_DIR:-../magento-${MAGENTO_EDITION:-community}-${MAGENTO_VERSION:-2.4.8-p5}}:/var/www/html:delegated"
      - "sockdata:/sock"
      # HTTP vhost on :8080 that reuses Magento's own nginx.conf (copied from
      # nginx.conf.sample by scripts/install-magento.sh). Replaces the image's
      # default HTTPS-only server block.
      - "./Test/E2E/docker/default.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "${MAGENTO_HTTP_PORT:-8080}:8080"
    networks: [magento]

volumes:
  # Carries the php-fpm unix socket between the app and nginx containers.
  sockdata:
