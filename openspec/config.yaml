schema: spec-driven

context: |
  Project: TaxCloud sales-tax integration module for Magento 2 / Adobe Commerce.
  The git repo root is app/code/Taxcloud/Magento2 inside a Warden-based Magento
  dev stack; the Magento root itself is not version-controlled.

  Tech stack: PHP (Magento 2.4.7–2.4.9), Magento module architecture
  (di.xml plugins/preferences, observers), TaxCloud SOAP API with an ongoing
  migration to the v3 REST API. Static analysis: PHPStan level 5 (with a
  tactical baseline being burned down). Tests: PHPUnit unit tests, plus
  dockerized integration and e2e suites.

  Conventions and constraints:
  - Everything is store-aware: every setting/feature gate must resolve against
    the store of the entity being processed (order, quote, invoice), never the
    ambient store. New config reads must follow this.
  - Test code must be compatible with PHPUnit 9.5, 10.5, and 12.5
    (Magento 2.4.7/2.4.8/2.4.9 CI matrix).
  - Unit tests are always written for changes; integration/e2e tests are
    proposed and confirmed with the maintainer before being added.
  - Capture is whole-order only: neither SOAP nor v3 REST supports partial
    capture; capture_trigger config controls when capture happens, not how much.
  - Releases are squash-merged into main; release branches must never merge
    main back in.

rules:
  proposal:
    - Always include a "Non-goals" section
    - Call out any store-scoping implications explicitly
  tasks:
    - Include a task for unit tests covering the change
    - When integration or e2e coverage seems warranted, add a task to propose
      it to the maintainer rather than assuming it
